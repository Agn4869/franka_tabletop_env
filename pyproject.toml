[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "franka-tabletop-env"
version = "0.3.0"
description = "GenieSim tabletop scene, randomization, sensing and recording with Isaac Sim Franka"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "PyYAML>=6,<7", "Pillow>=10,<13"]

[project.optional-dependencies]
usd = ["usd-core>=25.5,<26"]

[project.scripts]
franka-tabletop = "geniesim_features.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
