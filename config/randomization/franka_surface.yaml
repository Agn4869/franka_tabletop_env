schema_version: 1
components:
  object_surface:
    kind: material
    target: /World/Objects/pick_object
    parameters:
      base_color:
        distribution: choice
        values: [[0.7, 0.15, 0.1], [0.15, 0.65, 0.25], [0.15, 0.3, 0.75]]
      roughness: {distribution: uniform, low: 0.3, high: 0.7}
